# Target engine config for loadgen benchmarks.
# Receives OTLP on 127.0.0.1:4317, sinks to perf exporter.
# Telemetry available at http://127.0.0.1:8080/telemetry/metrics
version: otel_dataflow/v1
engine: {}
groups:
  default:
    pipelines:
      main:
        policies:
          channel_capacity:
            control:
              node: 100
              pipeline: 100
            pdata: 128

        nodes:
          receiver:
            type: receiver:otlp
            config:
              protocols:
                grpc:
                  listening_addr: "127.0.0.1:4317"
          perf:
            type: exporter:perf
            config:
              frequency: 1000
              cpu_usage: false
              mem_usage: false
              disk_usage: false
              io_usage: false

        connections:
          - from: receiver
            to: perf
