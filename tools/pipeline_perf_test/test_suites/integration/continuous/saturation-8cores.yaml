# Saturation test with 8 core df_engine
from_template:
  path: test_suites/integration/continuous/saturation-cores-template.yaml.j2
  variables:
    num_cores: 8
    engine_core_range: "6-13"
    loadgen_cores: 12
    loadgen_core_range: "14-25"
    backend_cores: 1
    backend_core_range: "1-1"
    max_batch_size: 8000
