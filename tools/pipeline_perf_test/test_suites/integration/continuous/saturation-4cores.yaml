# Saturation test with 4 core df_engine
from_template:
  path: test_suites/integration/continuous/saturation-cores-template.yaml.j2
  variables:
    num_cores: 4
    engine_core_range: "6-9"
    loadgen_cores: 8
    loadgen_core_range: "10-17"
    backend_cores: 1
    backend_core_range: "1-1"
    max_batch_size: 2400
